name: Simple
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  native:
    name: "Simple: GHC ${{ matrix.ghc }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        # Older GHCs need LLVM on macos-latest (ARM)
        ghc: ['9.10.2']
        psql: ['16', '17']
      fail-fast: false
    timeout-minutes:
      60
    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Set up Haskell
        id: setup-haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: '3.10.2.0'

      - name: Set up PostgreSQL
        uses: ikalnytskyi/action-setup-postgres@v7
        id: postgres
        with:
          username: ci
          password: sw0rdfish
          database: test
          postgres-version: ${{ matrix.psql }}

      - name: Debug
        shell: bash
        run: |
          ls c:/progra~1/postgr~1/ || true
          ls /c || true
          ldd c:/progra~1/postgr~1/*/lib/pq.dll
            
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ runner.os }}-${{ matrix.ghc }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ matrix.ghc }}-

      - name: cabal.project (win)
        if: matrix.os == 'windows-latest'
        run: cp cabal.project.win cabal.project

      - name: cabal.project (macos)
        if: matrix.os == 'macos-latest'
        run: cp cabal.project.macos cabal.project

      - name: ghc-pkg dump
        run: ghc-pkg list

      - name: Dependencies
        run: cabal build all --enable-tests --only-dependencies

      - name: Build
        run: cabal build all --enable-tests

      - name: Test
        run: cabal test all --enable-tests --test-show-details=direct
        env:
          DATABASE_CONNSTRING: ${{ steps.postgres.outputs.connection-uri }}
